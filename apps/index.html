<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="robots" content="noindex,nofollow">
  <title>Projets</title>
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="./assets/portal.js" defer></script>
</head>
<body class="portal">
  <div class="app-layout">
    <aside class="side-nav">
      <a href="./" class="side-brand" aria-label="Accueil projets">A<span>/</span>R</a>
      <div class="side-nav-links">
        <a class="side-link selected" href="./"><span class="side-icon">▦</span><span>Projets</span></a>
        <a class="side-link" href="./finances/"><span class="side-icon">◈</span><span>Finances</span></a>
      </div>
      <a class="side-bottom" href="../">Site personnel ↗</a>
    </aside>
    <div class="main-view">
      <header class="workspace-header">
        <span class="workspace-label">ESPACE PRIVÉ</span>
        <a class="header-link" href="https://github.com/Achraf-Saidi" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </header>
      <main class="workspace-content">
        <div class="page-heading"><div><h1>Projets</h1><p>Accès direct</p></div><span class="count">08</span></div>
        <div class="tiles">
          <a class="tool-tile" href="../sahati/" target="_blank" rel="noopener noreferrer"><div class="tool-mark" style="--tone:#64c0ae">✚</div><div class="tile-body"><h2>SAHATI</h2><span>Santé</span></div><span class="tile-arrow">↗</span></a>
          <a class="tool-tile" href="../numeria/" target="_blank" rel="noopener noreferrer"><div class="tool-mark" style="--tone:#b1a3f5">N</div><div class="tile-body"><h2>Numeria</h2><span>Éducation</span></div><span class="tile-arrow">↗</span></a>
          <a class="tool-tile" href="../djezz/" target="_blank" rel="noopener noreferrer"><div class="tool-mark" style="--tone:#e49dc5">D</div><div class="tile-body"><h2>DJEZZ</h2><span>Application</span></div><span class="tile-arrow">↗</span></a>
          <a class="tool-tile" href="../aion/" target="_blank" rel="noopener noreferrer"><div class="tool-mark" style="--tone:#82aff1">◎</div><div class="tile-body"><h2>AION</h2><span>Jumeau médical</span></div><span class="tile-arrow">↗</span></a>
          <div class="tool-tile configurable" data-project="jetnext"><div class="tool-mark" style="--tone:#f6b76f">J</div><div class="tile-body"><h2>JetNext</h2><span>Entreprise</span></div><button class="tile-setting link-config" data-configure="jetnext" type="button">Ajouter le lien →</button></div>
          <a class="tool-tile" href="../athar/" target="_blank" rel="noopener noreferrer"><div class="tool-mark" style="--tone:#d9bf86">△</div><div class="tile-body"><h2>ATHAR</h2><span>Opérations</span></div><span class="tile-arrow">↗</span></a>
          <a class="tool-tile" href="https://app.novalisai.com/os/" target="_blank" rel="noopener noreferrer"><div class="tool-mark" style="--tone:#9fc9d8">N.</div><div class="tile-body"><h2>Novalis OS</h2><span>ERP</span></div><span class="tile-arrow">↗</span></a>
          <a class="tool-tile finance-tile" href="./finances/"><div class="tool-mark" style="--tone:#e4c18e">A&R</div><div class="tile-body"><h2>Achraf & Rayan</h2><span>Finances</span></div><span class="tile-arrow">↗</span></a>
        </div>
      </main>
    </div>
  </div>
  <dialog class="modal" id="linkDialog" aria-labelledby="linkTitle">
    <form id="linkForm">
      <h2 id="linkTitle">Lien JetNext</h2>
      <label for="projectUrl">URL HTTPS</label>
      <input type="url" id="projectUrl" placeholder="https://..." required pattern="https://.*">
      <p class="form-error" id="linkError" role="alert"></p>
      <div class="modal-actions"><button class="btn secondary" type="button" id="cancelLink">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div>
    </form>
  </dialog>
</body>
</html>
