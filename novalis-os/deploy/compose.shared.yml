# Use with compose.yml when the VPS already hosts another application.
# The existing reverse proxy remains the only listener on ports 80 and 443.
# If that proxy is itself containerised, qualify a dedicated Docker network
# instead of pointing the proxy container at its own 127.0.0.1 address.
services:
  app:
    ports:
      - "127.0.0.1:${NOVALIS_BACKEND_PORT:-18080}:8000"
    mem_limit: ${NOVALIS_APP_MEMORY:-512m}
    cpus: ${NOVALIS_APP_CPUS:-1.0}
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  worker:
    mem_limit: ${NOVALIS_WORKER_MEMORY:-256m}
    cpus: ${NOVALIS_WORKER_CPUS:-0.5}
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
