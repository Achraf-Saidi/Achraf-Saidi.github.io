name: novalis-os
x-app: &app
  build:
    context: ../..
    dockerfile: novalis-os/deploy/Dockerfile
  env_file: .env
  environment:
    NOVALIS_DATA_DIR: /data
    NOVALIS_MODE: production
    NOVALIS_TRUST_PROXY: "true"
  volumes:
    - ${NOVALIS_STORAGE_PATH:-/srv/novalis-os/data}:/data
  read_only: true
  tmpfs:
    - /tmp:size=64M,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
services:
  app:
    <<: *app
    expose: [8000]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: [python, -m, novalis_os.worker]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ${NOVALIS_STORAGE_PATH:-/srv/novalis-os/data}:/data
      - ${NOVALIS_BACKUP_PATH:-/srv/novalis-os/backups}:/backups
    environment:
      NOVALIS_DATA_DIR: /data
      NOVALIS_BACKUP_DIR: /backups
      NOVALIS_MODE: production
  proxy:
    image: caddy:2-alpine
    # Opt in only after confirming that the VPS has no existing edge proxy.
    profiles: [dedicated-edge]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      NOVALIS_APP_DOMAIN: ${NOVALIS_APP_DOMAIN:-app.novalisai.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  proxy_data:
  proxy_config:
