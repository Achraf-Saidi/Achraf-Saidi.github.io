<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Novalis — revue responsive</title><style>body{font:14px system-ui;background:#e8ecf4;margin:24px;color:#19253e}h1{font-size:24px}main{display:flex;gap:24px;align-items:start;overflow:auto}figure{margin:0;flex:none}figcaption{margin:12px 0}iframe{border:1px solid #bbc7df;border-radius:12px;background:white;height:820px}label{margin-right:8px}select{padding:8px}p{max-width:800px;line-height:1.6}</style><h1>Revue manuelle des formats</h1><p>Pages actuelles, dimensions CSS de 320, 390, 768 et 1440 pixels. Les cadres facilitent l’inspection ; ils ne constituent pas un test sur appareil.</p><label for="language">Langue</label><select id="language"><option value="fr">FR</option><option value="en">EN</option><option value="nl">NL</option><option value="de">DE</option></select><main><figure><figcaption>Téléphone compact · 320 px</figcaption><iframe title="Téléphone compact" width="320" src="../fr/"></iframe></figure><figure><figcaption>Téléphone · 390 px</figcaption><iframe title="Téléphone" width="390" src="../fr/"></iframe></figure><figure><figcaption>Tablette · 768 px</figcaption><iframe title="Tablette" width="768" src="../fr/"></iframe></figure><figure><figcaption>Ordinateur · 1440 px</figcaption><iframe title="Ordinateur" width="1440" src="../fr/"></iframe></figure></main><script>document.querySelector('select').addEventListener('change',e=>document.querySelectorAll('iframe').forEach(f=>f.src='../'+e.target.value+'/'));</script></html>
