font-size="14" font-weight="400">Rechercher un dossier, une personne, une référence…</text><text x="1421" y="47" fill="#52687f" font-size="14" font-weight="400">Aide</text><rect x="1505" y="22" width="36" height="36" rx="18" fill="#dce6ef" stroke="none"/><text x="1515" y="47" fill="#243449" font-size="12" font-weight="700">AS</text><text x="260" y="148" fill="#1c2e43" font-size="37" font-weight="600">Le bon message, au bon moment.</text><text x="260" y="181" fill="#61748a" font-size="16" font-weight="400">Gardez ensemble l’échéance, les échanges et le règlement réellement constaté.</text><rect x="260" y="218" width="722" height="695" rx="12" fill="#fff" stroke="#dce4ed"/><text x="284" y="257" fill="#243449" font-size="21" font-weight="600">Factures à suivre</text><text x="284" y="291" fill="#61748a" font-size="12" font-weight="600">Référence / dossier</text><text x="719" y="291" fill="#61748a" font-size="12" font-weight="600">Échéance</text><text x="859" y="291" fill="#61748a" font-size="12" font-weight="600">Solde</text><rect x="275" y="316" width="692" height="144" rx="8" fill="#f4f7fb" stroke="none"/><text x="294" y="348" fill="#243449" font-size="14" font-weight="600">NV-2026-041</text><text x="294" y="376" fill="#243449" font-size="16" font-weight="600">Atelier Sillage</text><rect x="294" y="399" width="186" height="32" rx="7" fill="#e8eff7" stroke="none"/><text x="306" y="421" fill="#385f90" font-size="13" font-weight="600">Promesse reçue</text><text x="720" y="371" fill="#61748a" font-size="14" font-weight="400">12 oct.</text><text x="859" y="371" fill="#243449" font-size="15" font-weight="600">1 200 €</text><rect x="275" y="477" width="692" height="144" rx="8" fill="#fff" stroke="none"/><text x="294" y="509" fill="#243449" font-size="14" font-weight="600">NV-2026-038</text><text x="294" y="537" fill="#243449" font-size="16" font-weight="600">Maison du Parc</text><rect x="294" y="560" width="186" height="32" rx="7" fill="#fff0db" stroke="none"/><text x="306" y="582" fill="#98622b" font-size="13" font-weight="600">Question ouverte</text><text x="720" y="532" fill="#61748a" font-size="14" font-weight="400">09 oct.</text><text x="859" y="532" fill="#243449" font-size="15" font-weight="600">860 €</text><rect x="275" y="638" width="692" height="144" rx="8" fill="#fff" stroke="none"/><text x="294" y="670" fill="#243449" font-size="14" font-weight="600">NV-2026-044</text><text x="294" y="698" fill="#243449" font-size="16" font-weight="600">Studio Rivage</text><rect x="294" y="721" width="186" height="32" rx="7" fill="#edf1f5" stroke="none"/><text x="306" y="743" fill="#52687f" font-size="13" font-weight="600">À venir</text><text x="720" y="693" fill="#61748a" font-size="14" font-weight="400">22 oct.</text><text x="859" y="693" fill="#243449" font-size="15" font-weight="600">2 430 €</text><text x="287" y="849" fill="#61748a" font-size="13" font-weight="400">Une promesse n’est pas un règlement confirmé.</text><rect x="1005" y="218" width="553" height="695" rx="12" fill="#fff" stroke="#dce4ed"/><text x="1031" y="256" fill="#243449" font-size="22" font-weight="600">Atelier Sillage</text><rect x="1031" y="279" width="207" height="32" rx="7" fill="#fff0db" stroke="none"/><text x="1043" y="301" fill="#98622b" font-size="13" font-weight="600">Relance à relire</text><text x="1031" y="358" fill="#243449" font-size="16" font-weight="600">Contexte du dossier</text><text x="1031" y="392" fill="#61748a" font-size="14" font-weight="400">Promesse annoncée : 21 octobre</text><text x="1031" y="419" fill="#61748a" font-size="14" font-weight="400">Règlement confirmé : en attente</text><path d="M1031 451H1533" stroke="#dce4ed"/><text x="1031" y="492" fill="#61748a" font-size="15" font-weight="600">Message préparé</text><rect x="1031" y="514" width="500" height="182" rx="10" fill="#f3f6fa" stroke="none"/><text x="1051" y="548" fill="#405770" font-size="14" font-weight="400">Bonjour,</text><text x="1051" y="581" fill="#405770" font-size="14" font-weight="400">Nous revenons vers vous au sujet de la facture</text><text x="1051" y="614" fill="#405770" font-size="14" font-weight="400">NV-2026-041. Vous nous avez indiqué le 21 octobre.</text><text x="1051" y="647" fill="#405770" font-size="14" font-weight="400">Pouvez-vous nous confirmer cette échéance ?</text><rect x="1031" y="725" width="500" height="50" rx="9" fill="#263f5e" stroke="none"/><text x="1141" y="756" fill="#fff" font-size="15" font-weight="600">Vérifier avant envoi</text><text x="1031" y="830" fill="#61748a" font-size="12" font-weight="400">Montant, destinataire et contexte restent à vérifier.</text></g></svg>