<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUMERIA · formulaire accessible</title><style>body{font:16px/1.8 system-ui;background:#f7f7f2;color:#242326;max-width:600px;margin:50px auto;padding:25px}form{display:grid;gap:15px}input,button{font:inherit;padding:12px;border:1px solid #aaa;border-radius:6px}button{background:#6840d8;color:#fff}h1{line-height:1.2}</style><h1>Un formulaire compréhensible.</h1><p>Extrait gratuit NUMERIA. Démonstration locale : aucune donnée n’est envoyée ou enregistrée.</p><form id="demo"><label for="email">Adresse e-mail</label><input id="email" type="email" required aria-describedby="hint"><p id="hint">Exemple : nom@domaine.dz. Le test valide uniquement la forme.</p><button type="submit">Tester le formulaire</button></form><p id="status" role="status"></p><script>document.getElementById('demo').addEventListener('submit',e=>{e.preventDefault();document.getElementById('status').textContent='Format accepté. Aucune donnée envoyée.'})</script></html>
