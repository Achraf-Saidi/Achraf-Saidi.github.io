name: Refresh NovalisAI public copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/novalis-copy-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'Achraf-Saidi/Achraf-Saidi.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all four languages and the homepage
        run: python novalisai/build.py
      - name: Verify localized commercial copy
        run: |
          python - <<'PY'
          from pathlib import Path
          for lang,term in {'fr':'Notre outil de travail.','en':'Our own workspace.','nl':'Onze eigen werkomgeving.','de':'Unser eigener Workspace.'}.items():
              html=(Path('novalisai')/lang/'index.html').read_text()
              assert term in html, (lang,term)
              assert 'JetNext' in html and 'Novalis OS' in html
              assert not any(term in html for term in ('en Afrique','in Africa','in Afrika'))
          assert 'Notre outil de travail.' in Path('novalisai/index.html').read_text()
          PY
      - name: Commit generated files
        run: |
          git config user.name "Novalis website bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add novalisai/index.html novalisai/fr novalisai/en novalisai/nl novalisai/de novalisai/sitemap.xml
          if git diff --cached --quiet; then
            echo "Generated pages already up to date"
          else
            git commit -m "Generate localized NovalisAI commercial updates"
            git push origin HEAD:main
          fi
