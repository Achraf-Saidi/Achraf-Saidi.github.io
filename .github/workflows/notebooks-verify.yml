name: Achraf Notebooks verification
on:
  push:
    branches: [main]
    paths: ['achraf-notebooks/source/**', '.github/workflows/notebooks-verify.yml']
  pull_request:
    paths: ['achraf-notebooks/source/**', '.github/workflows/notebooks-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: achraf-notebooks/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: achraf-notebooks/source/package-lock.json
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: achraf-notebooks/source/projects/requirements.txt
      - run: python -m pip install -r projects/requirements.txt
      - run: python projects/iris.py
      - run: python projects/wine.py
      - run: python projects/gradient.py
      - run: python projects/backprop.py
