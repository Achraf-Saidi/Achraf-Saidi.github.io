name: Achraf Notebooks private platform checks
on:
  push:
    branches: [main]
    paths: ['achraf-notebooks/platform/**', '.github/workflows/notebooks-platform-verify.yml']
  pull_request:
    paths: ['achraf-notebooks/platform/**', '.github/workflows/notebooks-platform-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: achraf-notebooks/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Scaffold only: use a pinned, audited lockfile before production.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
